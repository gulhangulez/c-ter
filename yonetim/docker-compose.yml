# Tek sunucuda (VPS) çalıştırma: veritabanı + panel/webhook + arka plan işçisi.
# Kullanım: cp .env.example .env && (değerleri doldurun) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cince_yonetim
      POSTGRES_USER: cince
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlanmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://cince:${POSTGRES_PASSWORD}@db:5432/cince_yonetim
    command: ["node", "dist/src/main.js", "migrate"]
    depends_on: [db]
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cince:${POSTGRES_PASSWORD}@db:5432/cince_yonetim
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cince:${POSTGRES_PASSWORD}@db:5432/cince_yonetim
    command: ["node", "dist/src/main.js", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
