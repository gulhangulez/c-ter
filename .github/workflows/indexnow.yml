# Manual IndexNow submission. Run it from GitHub: Actions > IndexNow > Run workflow,
# only after the new site zip has been uploaded to the server.
name: IndexNow
on:
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: npm run indexnow -- --send
